# @package _global_
# ArtELingo dataset config for the buddy-percept comprehensive sweep
# (docs/superpowers/plans/2026-09-28-buddy-percept-sweep.md).
#
# Identical to configs/dataset/artelingo.yaml, plus one additional path:
# the PercepT-style patch-feature cache the sweep's Stage 2 mapper reads
# (src/test/20260922_percept_topic_pipeline/run_percept_stage2_pilot.py's
# TRAIN_PATCH_FEATURE_PATH/HELDOUT_PATCH_FEATURE_PATH). This file exists so
# `cluster check --sync-data -- python main_cosir.py dataset=artelingo_buddy_percept_sweep`
# can use cluster-run's existing generic path-sync mechanism (any resolved
# config key ending in _path/_dir/_root/_base) to get this cache onto a
# DAS6 node via DATA_MAP, without modifying the shared artelingo.yaml or
# extending cluster.py itself. Not used for actual training.

data:
  dataset_type: "artelingo"
  train_annotation_path: "/data/PDD/artelingo/artelingo_train.json"
  test_annotation_path: "/data/PDD/artelingo/artelingo_val.json"
  train_image_path: "/data/PDD/wikiart_proj/wikiart"
  test_image_path: "/data/PDD/wikiart_proj/wikiart"

featuremanager:
  storage_dir: "/data/SSD2/pre_extract/artelingo/features"
  patch_feature_dir: "/data/SSD2/pre_extract/artelingo_percept_patch_features"

experiment:
  name: "CoSiR_Experiment"
  tags: ["CoSiR", "ArtELingo", "local", "buddy-percept-sweep"]
  description: "Data-sync trigger only for the buddy-percept comprehensive sweep"
  results_dir: "res/CoSiR_Experiment/artelingo"
