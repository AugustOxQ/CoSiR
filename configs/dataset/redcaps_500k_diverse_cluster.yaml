# @package _global_
# RedCaps-500k-diverse Dataset Configuration (DAS6 cluster)
#
# Cluster counterpart of the local redcaps_500k_diverse cell used by
# scripts/run_buddy_k_ablation_redcaps_500k.sh (via redcaps_full + EXTRA_OVERRIDES).
# Baked in directly here instead of reusing that override pattern, since this config
# exists to run exactly one dataset on the cluster, not a whole K-scaling family.
#
# Same in-domain RedCaps test set as the local redcaps_150k/full configs
# (redcaps_test.json, 25k pairs) so oracle/pre_diff numbers stay comparable to
# docs/reports/2026-09-02_combiner_architecture_ablation.md's smoke-scale results —
# NOT the COCO test set redcaps_cluster.yaml substitutes.
#
# Raw test-image subset (first 5000 of 25000 records at eval.test_ratio=0.2) + both
# annotation JSONs pushed manually to /var/scratch/wding/Dataset/redcaps_plus/ —
# cluster_sync_up.sh's dataset sync only covers the pre-extracted feature cache
# (DATA_LOCAL_BASE/DATA_REMOTE_BASE), never raw annotations/images.

# Dataset paths
data:
  dataset_type: "redcaps"
  train_annotation_path: "/var/scratch/wding/Dataset/redcaps_plus/redcaps_500k_diverse.json"
  test_annotation_path: "/var/scratch/wding/Dataset/redcaps_plus/redcaps_test.json"
  train_image_path: "/var/scratch/wding/Dataset/redcaps_plus/images"
  test_image_path: "/var/scratch/wding/Dataset/redcaps_plus/images"

# Feature manager paths - dataset specific (pushed via cluster_sync_up.sh redcaps_500k_diverse)
featuremanager:
  storage_dir: "/local/wding/Dataset/pre_extract/redcaps_500k_diverse/features"

# Experiment Configuration
experiment:
  name: "CoSiR_Experiment"
  tags: ["CoSiR", "RedCaps500kDiverse", "Cluster"]
  description: "Full-scale combiner architecture validation on DAS6 node411"
  results_dir: "/local/wding/res/CoSiR_Experiment/redcaps_500k_diverse_cluster" # overridden per-arm by the sweep script
