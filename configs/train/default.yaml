# @package _global_
# Training Configuration

train:
  epochs: 30
  epochs_2: 20 # Label prediction loss epochs
  num_workers: 0
  batch_size: 1024 # This is the batchsize of the evaluation set
  initialization_strategy: imgtxt #TODO: change to imgtxt, debugging time use zeros
  imgtxt_factor: 10.0 #TODO: change to 1.0, debugging time use 10.0 #IMPORTANT: when changing this, we need to re-extract the label embeddings, so also need to change the template embeddings
  use_template_embeddings: True
  save_as_template_embeddings: True
  load_existing_features: True
  representative_number: 12 # This should equal to selected number of conditions * number of grids
  normalize: false
  em_interval: -1 # EM-style training: alternate every N epochs between updating network and updating conditions (negative = disabled, update both every epoch)
  caption_upsample: 2.5 # C1: caption sample weight relative to other types (1.0 = disabled)

# Loss function configuration
loss:
  margin: 0.3
  lambda_contrastive: 1.0
  lambda_laplacian: 0.1
  lambda_collapse: 0.1
  lambda_boundary: 0.0
  lambda_mixup: 0.1 # iMix loss weight (0 = disabled)
  lambda_delta: 0.0 # delta norm penalty — ineffective for gate, disabled
  lambda_gate: 0.05 # gate entropy maximisation (encourages s away from 0/1)
  lambda_gate_logit: 0.1 # L2 on raw gate logit — prevents sigmoid saturation (gradient grows with logit)
  lambda_preserve: 0.05 # preservation: penalise combined output drifting far from input
  lambda_pred: 0.1 # condition predictor distillation weight (0 = disabled)
  lambda_ent: 0.05 # L5: predictor type-entropy diversity — maximise batch-level type spread (0 = disabled)
  ent_tau: 5.0 # temperature for type-affinity softmax in L5
  mixup_alpha: 1.0 # Beta distribution alpha for iMix sampling
  return_dict: true

# Optimizer configuration
optimizer:
  type: "AdamW"
  lr: 1.0e-5 # model parameters
  lr_label: 1.0e-2 # label embeddings
  weight_decay: 5.0e-2

# Scheduler configuration
scheduler:
  type: "CosineAnnealingLR" # CosineAnnealingLR, LinearLR, SequentialLR, CosineAnnealingWarmRestarts
  T_max: 0 # Should match train.epochs
  T_0: 50
  T_mult: 1 # This has to be int
  eta_min: 1.0e-9

# Evaluation configuration
eval:
  k_vals: [1, 5, 10]
  train_max_batches: 25 # This is during validation, how many batches we check
  print_metrics: true
  evaluation_interval: 20
  perform_evaluation: true
  oracle_aggregation: "max" # "max" = oracle upper bound, "mean" = average across conditions
